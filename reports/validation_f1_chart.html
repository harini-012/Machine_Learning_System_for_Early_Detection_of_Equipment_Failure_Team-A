<!-- Design plan: tokens -->
<style>

:root {

  --fg-dark: #e0e0e0; /* dark foreground */
  --accent: #4c78a8; /* chart color */
  --font-body: 'Inter', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--bg-dark);

  }
}
:root[data-theme="dark"] {
  --bg: var(--bg-dark);
  --fg: var(--fg-dark);
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.5;

  padding: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-top, 0px));
  display: flex;

  align-items: center;
  gap: 1rem;
}
h1 {
  font-size: 1.75rem;
  font-weight: 600;
  margin: 0;
}
img {
  max-width: 100%;
  height: auto;
  border: 1px solid var(--accent);
  border-radius: 4px;
}
figcaption {
  font-size: 0.9rem;
  color: var(--fg);
  margin-top: 0.5rem;
  text-align: center;
}
</style>
